<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Loan EMI Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Home Loan EMI Calculator</h1>

  <div class="calculator">
    <div class="inputs">

      <div class="input-group">
        <div class="input-label">
          <label>Loan Amount</label>
          <input type="number" id="amountBox" value="2500000">
        </div>
        <input type="range" id="amountSlider" min="100000" max="100000000" step="10000" value="2500000">
        <div class="range-labels">
          <span>₹1 Lac</span>
          <span>₹10 Cr</span>
        </div>
      </div>

      <div class="input-group">
        <div class="input-label">
          <label>Tenure (Years)</label>
          <input type="number" id="tenureBox" value="30">
        </div>
        <input type="range" id="tenureSlider" min="1" max="30" step="1" value="30">
        <div class="range-labels">
          <span>1</span>
          <span>30</span>
        </div>
      </div>

      <div class="input-group">
        <div class="input-label">
          <label>Interest Rate (% P.A.)</label>
          <input type="number" id="rateBox" value="7.75" step="0.01">
        </div>
        <input type="range" id="rateSlider" min="0.5" max="15" step="0.05" value="7.75">
        <div class="range-labels">
          <span>0.5</span>
          <span>15</span>
        </div>
      </div>

    </div>

    <div class="results">
      <div class="result-top">
        <p class="result-label">Monthly Home Loan EMI</p>
        <p class="result-value" id="emiValue">₹0</p>
      </div>

      <div class="result-row">
        <p class="result-label">Principal Amount</p>
        <p class="result-value small" id="principalValue">₹0</p>
      </div>

      <div class="result-row">
        <p class="result-label">Interest Amount</p>
        <p class="result-value small" id="interestValue">₹0</p>
      </div>

      <div class="result-row">
        <p class="result-label">Total Amount Payable</p>
        <p class="result-value small" id="totalValue">₹0</p>
      </div>

      <div class="pie-chart" id="pieChart"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
